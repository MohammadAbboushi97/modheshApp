buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
        // Force AndroidX core libraries to a version compatible with AGP 8.1/compileSdk 34
        androidxCoreVersion = "1.12.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Keep core/androidx libs on a version that doesn't require compileSdk 35
subprojects { project ->
    project.configurations.all { config ->
        config.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "androidx.core") {
                details.useVersion rootProject.ext.androidxCoreVersion
                details.because("androidx.core 1.16.0+ requires AGP 8.6 and compileSdk 35; project targets 34")
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
